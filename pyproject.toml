[project]
name = "tdei-copy"
version = "0.1.0"
description = "Copy every dataset in one TDEI project group to another project group"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "requests-toolbelt>=1.0",
    "tqdm>=4.66",
]

[project.scripts]
tdei-copy = "tdei_copy:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tdei_copy"]

[tool.ruff]
target-version = "py310"
line-length = 132

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
